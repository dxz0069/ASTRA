services:
  astra-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: astra-app
    container_name: astra-server
    ports:
      - "8000:8000"
    volumes:
      - ./datas/astra/:/root/.local/share/astra/
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/projects', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 3s
    restart: unless-stopped
    command: ["uv", "run", "astra", "serve", "--host", "0.0.0.0", "--no-access-log"]
  astra-dispatcher:
    build:
      context: .
      dockerfile: Dockerfile
    image: astra-app
    container_name: astra-dispatcher
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./dispatch.yaml:/astra/dispatch.yaml
    depends_on:
      astra-server:
        condition: service_healthy
    restart: unless-stopped
    command: ["uv", "run", "astra", "dispatch", "--config", "dispatch.yaml"]
