[project]
name = "astra"
version = "0.1.0"
description = "Star-chart navigation engine for AI-driven security operations"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "click>=8.1",
    "pyyaml>=6.0",
    "docker>=7.1.0",
    "requests>=2.32.3",
]

[project.scripts]
astra = "astra.cli:main"

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true
